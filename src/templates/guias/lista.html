{% extends 'base.html' %}
{% block title %}Guías{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Guías</h1>
</div>

<div class="rejilla-guias">

  <div class="card">
    <div class="table-wrap">
      <table class="data-table">
        <caption class="visualmente-oculto">Guías</caption>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          {% for g in guias %}
          <tr>
            <td class="principal">
              <form method="post" action="{{ url_for('guias_editar', id=g.id) }}"
                    style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
                <input type="text" name="nombre" value="{{ g.nombre }}"
                       aria-label="Nombre del guía"
                       style="flex:1 1 180px; min-width:0; padding:5px 8px; border:1px solid #ddd; border-radius:5px; font-size:13px;">
                <label for="activo-{{ g.id }}" style="display:flex; align-items:center; gap:6px; text-transform:none; letter-spacing:normal; font-weight:500; cursor:pointer;">
                  <input type="checkbox" id="activo-{{ g.id }}" name="activo" value="1" style="width:auto;"
                         {% if g.activo %}checked{% endif %}>
                  Activo
                </label>
                {% if not g.activo %}<span class="badge badge-inactivo">Inactivo</span>{% endif %}
                <button type="submit" class="btn btn-secondary btn-sm">Guardar</button>
              </form>
            </td>
            <td class="td-actions" data-etiqueta="">
              <form method="post" action="{{ url_for('guias_eliminar', id=g.id) }}"
                    onsubmit="return confirm('¿Eliminar al guía {{ g.nombre }}?')">
                <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
              </form>
            </td>
          </tr>
          {% else %}
          <tr>
            <td colspan="2" style="text-align:center; color:#888; padding:24px;">No hay guías registradas.</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

  <div class="card" style="padding:20px;">
    <h2 style="font-family:var(--font-head); font-size:16px; color:var(--navy); margin-bottom:16px;">Nuevo guía</h2>
    <form method="post" action="{{ url_for('guias_nuevo') }}">
      <div class="form-group" style="margin-bottom:12px;">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Nombre del guía">
      </div>
      <div class="form-group" style="margin-bottom:12px;">
        <label for="activo" style="display:flex; align-items:center; gap:8px; text-transform:none; letter-spacing:normal; font-weight:500; cursor:pointer;">
          <input type="checkbox" id="activo" name="activo" value="1" style="width:auto;" checked>
          Activo
        </label>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Añadir guía</button>
    </form>
  </div>

</div>
{% endblock %}
